<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Archive</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#f3efe6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Archive" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<style>
  html, body { margin: 0; height: 100%; background: #f3efe6; -webkit-text-size-adjust: 100%; }
  #root { min-height: 100%; }
  #ar-update-banner {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom));
    z-index: 9999; display: flex; align-items: center; gap: 12px;
    background: #1c1a17; color: #f3efe6;
    font-family: 'Newsreader', Georgia, 'Times New Roman', serif; font-size: 14px;
    padding: 10px 12px 10px 16px; max-width: calc(100% - 28px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.28);
    animation: ar-ub-in 0.35s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes ar-ub-in {
    from { opacity: 0; transform: translate(-50%, 12px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .ar-ub-msg { letter-spacing: 0.02em; }
  .ar-ub-btn {
    font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
    background: #f3efe6; color: #1c1a17; border: none; padding: 7px 14px; cursor: pointer;
  }
  .ar-ub-btn:active { transform: translateY(1px); }
  .ar-ub-x {
    background: transparent; color: #f3efe6; border: none; font-size: 15px;
    line-height: 1; padding: 4px; cursor: pointer; opacity: 0.7;
  }
  .ar-ub-x:hover { opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  if (!("serviceWorker" in navigator)) return;
  var updateInitiated = false;

  function showBanner(worker) {
    if (document.getElementById("ar-update-banner")) return;
    var bar = document.createElement("div");
    bar.id = "ar-update-banner";

    var msg = document.createElement("span");
    msg.className = "ar-ub-msg";
    msg.textContent = "New version available";

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "ar-ub-btn";
    btn.textContent = "Reload";
    btn.addEventListener("click", function () {
      btn.textContent = "Updating\u2026";
      updateInitiated = true;
      if (worker) worker.postMessage({ type: "SKIP_WAITING" });
    });

    var x = document.createElement("button");
    x.type = "button";
    x.className = "ar-ub-x";
    x.setAttribute("aria-label", "Dismiss");
    x.textContent = "\u2715";
    x.addEventListener("click", function () { bar.remove(); });

    bar.appendChild(msg);
    bar.appendChild(btn);
    bar.appendChild(x);
    document.body.appendChild(bar);
  }

  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").then(function (reg) {
      // An update may already be waiting from a previous launch.
      if (reg.waiting && navigator.serviceWorker.controller) showBanner(reg.waiting);

      // Or one may be found while the app is open.
      reg.addEventListener("updatefound", function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", function () {
          if (nw.state === "installed" && navigator.serviceWorker.controller) showBanner(nw);
        });
      });

      // Check for updates when the app regains focus, and hourly while open.
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") reg.update().catch(function () {});
      });
      setInterval(function () { reg.update().catch(function () {}); }, 3600000);
    }).catch(function () {});

    // Reload once the new worker takes control — but only when WE triggered it,
    // so the first-load claim doesn't cause a spurious refresh.
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!updateInitiated) return;
      updateInitiated = false;
      window.location.reload();
    });
  });
})();
</script>
